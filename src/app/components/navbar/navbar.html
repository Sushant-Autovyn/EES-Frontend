<div class="navbar">

  <h2>Autovyn Employee Dashboard</h2>

  <div class="navbar-actions">

    <!-- Notification Bell -->
    <div class="notif-wrapper">
      <button class="notif-btn" (click)="toggleNotifications()">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="#334155" viewBox="0 0 24 24">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
        <span class="notif-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </button>

      <!-- Dropdown -->
      <div class="notif-dropdown" *ngIf="showNotifications">
        <div class="notif-header">
          <h4>Notifications</h4>
          <button class="mark-all-btn" (click)="markAllRead()" *ngIf="unreadCount > 0">Mark all read</button>
        </div>
        <div class="notif-list">
          <div class="notif-empty" *ngIf="notifications.length === 0">No notifications</div>
          <div class="notif-item" *ngFor="let n of notifications" [class.unread]="!n.is_read" (click)="markAsRead(n.id)">
            <div class="notif-title">{{ n.title }}</div>
            <div class="notif-msg">{{ n.message }}</div>
            <div class="notif-time">{{ n.created_at | date:'short' }}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile Info -->
    <div class="profile-info-badge">
      <div class="profile-avatar">
        <i class="fas fa-user"></i>
      </div>
      <div class="profile-info">
        <span class="profile-name">{{ userName }}</span>
        <span class="profile-role" [ngClass]="'role-' + userRole">{{ userRole }}</span>
      </div>
    </div>

  </div>

</div>
