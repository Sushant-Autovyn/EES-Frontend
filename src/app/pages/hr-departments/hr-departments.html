<app-sidebar></app-sidebar>

<div class="main">
  <app-navbar></app-navbar>
  <div class="content">
    <div class="header">
    <div class="header-content">
      <div>
        <h1>Departments</h1>
        <p>Manage organizational departments</p>
      </div>
      <button class="btn btn-add" (click)="openAdd()">
        <i class="fas fa-plus"></i> Add Department
      </button>
    </div>
  </div>

  <!-- Department Cards -->
  <div class="dept-grid">
    <div *ngFor="let dept of departments" class="dept-card">
      <div class="dept-header">
        <div class="dept-icon">
          <i class="fas fa-building"></i>
        </div>
        <span class="dept-status" [class.active]="dept.status === 'Active'" [class.inactive]="dept.status !== 'Active'">
          {{ dept.status }}
        </span>
      </div>
      <h3>{{ dept.name }}</h3>
      <p class="dept-desc">{{ dept.description || 'No description' }}</p>
      <div class="dept-meta">
        <div class="meta-item">
          <i class="fas fa-user-tie"></i>
          <span>{{ getHeadName(dept.head_id) }}</span>
        </div>
        <div class="meta-item">
          <i class="fas fa-users"></i>
          <span>{{ getEmployeeCount(dept.name) }} Employees</span>
        </div>
      </div>
      <div class="dept-actions">
        <button class="btn-edit" (click)="openEdit(dept)"><i class="fas fa-edit"></i> Edit</button>
        <button class="btn-delete" (click)="deleteDept(dept.id)"><i class="fas fa-trash"></i></button>
      </div>
    </div>
  </div>

  <div *ngIf="departments.length === 0" class="empty">
    <i class="fas fa-building"></i>
    <p>No departments found. Add one to get started.</p>
  </div>

  <!-- Add/Edit Modal -->
  <div *ngIf="showForm" class="modal-overlay" (click)="showForm = false">
    <div class="modal" (click)="$event.stopPropagation()">
      <h3>{{ editMode ? 'Edit' : 'Add' }} Department</h3>
      <div class="form-group">
        <label>Department Name</label>
        <input type="text" [(ngModel)]="formData.name" placeholder="e.g. Engineering" />
      </div>
      <div class="form-group">
        <label>Department Head</label>
        <select [(ngModel)]="formData.head_id">
          <option value="">Select Head</option>
          <option *ngFor="let emp of employees" [value]="emp.id">{{ emp.name }}</option>
        </select>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea [(ngModel)]="formData.description" rows="3" placeholder="Department description..."></textarea>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select [(ngModel)]="formData.status">
          <option value="Active">Active</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-save" (click)="submit()">{{ editMode ? 'Update' : 'Create' }}</button>
        <button class="btn btn-cancel" (click)="showForm = false">Cancel</button>
      </div>
    </div>
  </div>
</div>
</div>
