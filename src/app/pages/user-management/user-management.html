<app-sidebar></app-sidebar>

<div class="main">
  <app-navbar></app-navbar>
  <div class="content">
    <div class="header">
    <div class="header-content">
      <div><h1>User Management</h1><p>Create, edit, and manage user accounts</p></div>
      <button class="btn btn-add" (click)="openAdd()"><i class="fas fa-plus"></i> Add User</button>
    </div>
  </div>

  <div class="filters">
    <input type="text" [(ngModel)]="searchTerm" placeholder="Search users..." class="search-input" />
    <select [(ngModel)]="filterRole" class="filter-select">
      <option value="">All Roles</option>
      <option *ngFor="let r of roles" [value]="r">{{ r | titlecase }}</option>
      <option value="inactive">Inactive</option>
    </select>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr><th>User</th><th>Email</th><th>Role</th><th>Joined</th><th>Actions</th></tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of filteredUsers">
          <td>
            <div class="user-info">
              <div class="avatar" [style.background]="getRoleColor(u.role)">{{ u.name?.charAt(0)?.toUpperCase() }}</div>
              <strong>{{ u.name }}</strong>
            </div>
          </td>
          <td>{{ u.email }}</td>
          <td><span class="role-badge" [style.background]="getRoleColor(u.role) + '20'" [style.color]="getRoleColor(u.role)">{{ u.role }}</span></td>
          <td>{{ u.created_at | date:'mediumDate' }}</td>
          <td>
            <div class="action-btns">
              <button class="btn-icon edit" (click)="openEdit(u)" title="Edit"><i class="fas fa-edit"></i></button>
              <button class="btn-icon key" (click)="openResetPassword(u.id)" title="Reset Password"><i class="fas fa-key"></i></button>
              <button *ngIf="u.role !== 'inactive'" class="btn-icon warn" (click)="deactivate(u.id)" title="Deactivate"><i class="fas fa-user-slash"></i></button>
              <button *ngIf="u.role === 'inactive'" class="btn-icon success" (click)="activate(u)" title="Activate"><i class="fas fa-user-check"></i></button>
              <button class="btn-icon delete" (click)="deleteUser(u.id)" title="Delete"><i class="fas fa-trash"></i></button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
    <div *ngIf="filteredUsers.length === 0" class="empty">No users found.</div>
  </div>

  <!-- Add/Edit Modal -->
  <div *ngIf="showForm" class="modal-overlay" (click)="showForm = false">
    <div class="modal" (click)="$event.stopPropagation()">
      <h3>{{ editMode ? 'Edit' : 'Add' }} User</h3>
      <div class="form-group"><label>Name</label><input type="text" [(ngModel)]="formData.name" /></div>
      <div class="form-group"><label>Email</label><input type="email" [(ngModel)]="formData.email" /></div>
      <div *ngIf="!editMode" class="form-group"><label>Password</label><input type="password" [(ngModel)]="formData.password" /></div>
      <div class="form-group">
        <label>Role</label>
        <select [(ngModel)]="formData.role">
          <option *ngFor="let r of roles" [value]="r">{{ r | titlecase }}</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-save" (click)="submit()">{{ editMode ? 'Update' : 'Create' }}</button>
        <button class="btn btn-cancel" (click)="showForm = false">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Reset Password Modal -->
  <div *ngIf="showResetModal" class="modal-overlay" (click)="showResetModal = false">
    <div class="modal" (click)="$event.stopPropagation()">
      <h3>Reset Password</h3>
      <div class="form-group"><label>New Password</label><input type="text" [(ngModel)]="resetPassword" /></div>
      <div class="modal-actions">
        <button class="btn btn-save" (click)="resetPwd()">Reset</button>
        <button class="btn btn-cancel" (click)="showResetModal = false">Cancel</button>
      </div>
    </div>
  </div>

  <!-- Activate User Modal -->
  <div *ngIf="showActivateModal" class="modal-overlay" (click)="showActivateModal = false">
    <div class="modal" (click)="$event.stopPropagation()">
      <h3>Activate User</h3>
      <div class="form-group">
        <label>Select Role</label>
        <select [(ngModel)]="activateRole">
          <option value="employee">Employee</option>
          <option value="hr">HR</option>
          <option value="accountant">Accountant</option>
          <option value="admin">Admin</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-save" (click)="confirmActivate()">Activate</button>
        <button class="btn btn-cancel" (click)="showActivateModal = false">Cancel</button>
      </div>
    </div>
  </div>
</div>
</div>
