<div class="login-container">

  <!-- Left Panel -->
  <div class="login-left">
    <div class="left-content">
      <img src="autovyn_logo.jpg" alt="Logo" class="brand-logo">
      <h1>Simplify Your <span class="highlight">HR Workflow</span></h1>
      <p class="subtitle">One platform to manage attendance, payroll, leaves, and your entire workforce — all in real time.</p>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="login-right">
    <div class="login-box">

      <div class="login-header">
        <h2>Sign In</h2>
        <p>Enter your credentials to access your account</p>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon"><i class="fas fa-envelope"></i></span>
          <input
            id="email"
            type="email"
            placeholder="name@company.com"
            [(ngModel)]="loginData.email"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon"><i class="fas fa-lock"></i></span>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            [(ngModel)]="loginData.password"
          >
        </div>
      </div>

      <button class="login-btn" (click)="login()">
        Sign In
        <span class="btn-arrow"><i class="fas fa-arrow-right"></i></span>
      </button>

      <p class="forgot-link">
        <a href="javascript:void(0)" (click)="openForgot()">Forgot Password?</a>
      </p>

      <p class="register-link">Don't have an account? <a routerLink="/register">Create Account</a></p>

    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="forgot-overlay" *ngIf="forgotMode" (click)="closeForgot()">
    <div class="forgot-modal" (click)="$event.stopPropagation()">

      <button type="button" class="forgot-close" (click)="closeForgot()">&times;</button>

      <h3>Reset Password</h3>
      <p class="forgot-sub">We'll send a 6-digit OTP to your phone.</p>

      <!-- Step 1: Phone -->
      <div *ngIf="!otpMode">
        <div class="form-group">
          <label for="forgotPhone">Phone Number</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fas fa-phone"></i></span>
            <input
              id="forgotPhone"
              type="tel"
              placeholder="e.g. 9876543210"
              [(ngModel)]="forgotPhone"
            >
          </div>
        </div>

        <div class="form-group">
          <label>Send OTP via</label>
          <div class="channel-options">
            <label class="channel-option" [class.active]="otpChannel === 'whatsapp'">
              <input type="radio" name="otpChannel" value="whatsapp" [(ngModel)]="otpChannel">
              <i class="fab fa-whatsapp"></i> WhatsApp
            </label>
            <label class="channel-option" [class.active]="otpChannel === 'sms'">
              <input type="radio" name="otpChannel" value="sms" [(ngModel)]="otpChannel">
              <i class="fas fa-sms"></i> SMS
            </label>
          </div>
        </div>

        <button type="button" class="login-btn" (click)="sendOtp()" [disabled]="sendingOtp">
          {{ sendingOtp ? 'Sending...' : 'Send OTP' }}
          <span class="btn-arrow"><i class="fas fa-paper-plane"></i></span>
        </button>
      </div>

      <!-- Step 2: OTP + new password -->
      <div *ngIf="otpMode">
        <div class="form-group">
          <label for="otp">Enter OTP</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fas fa-key"></i></span>
            <input
              id="otp"
              type="text"
              placeholder="6-digit code"
              [(ngModel)]="otp"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <div class="input-wrapper">
            <span class="input-icon"><i class="fas fa-lock"></i></span>
            <input
              id="newPassword"
              type="password"
              placeholder="Enter new password"
              [(ngModel)]="newPassword"
            >
          </div>
        </div>

        <button type="button" class="login-btn" (click)="resetPassword()" [disabled]="resetting">
          {{ resetting ? 'Resetting...' : 'Reset Password' }}
          <span class="btn-arrow"><i class="fas fa-check"></i></span>
        </button>
      </div>

    </div>
  </div>

</div>
