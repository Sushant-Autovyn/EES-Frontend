<div class="login-container">

  <!-- Left Panel -->
  <div class="login-left">
    <div class="left-content">
      <img src="autovyn_logo.jpg" alt="Logo" class="brand-logo">
      <h1>Simplify Your <span class="highlight">HR Workflow</span></h1>
      <p class="subtitle">One platform to manage attendance, payroll, leaves, and your entire workforce — all in real time.</p>
      <div class="stats-row">
        <div class="stat-box">
          <span class="stat-number">50K+</span>
          <span class="stat-label">Employees</span>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-box">
          <span class="stat-number">99.9%</span>
          <span class="stat-label">Uptime</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Panel -->
  <div class="login-right">
    <div class="login-box">

      <div class="login-header">
        <h2>Sign In</h2>
        <p>Enter your credentials to access your account</p>
      </div>

      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-wrapper">
          <span class="input-icon"><i class="fas fa-envelope"></i></span>
          <input
            id="email"
            type="email"
            placeholder="name@company.com"
            [(ngModel)]="loginData.email"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon"><i class="fas fa-lock"></i></span>
          <input
            id="password"
            type="password"
            placeholder="Enter your password"
            [(ngModel)]="loginData.password"
          >
        </div>
      </div>

      <button class="login-btn" (click)="login()">
        Sign In
        <span class="btn-arrow"><i class="fas fa-arrow-right"></i></span>
      </button>

      <p class="forgot-link" (click)="forgotMode=true">Forgot Password?</p>

      <p class="register-link">Don't have an account? <a routerLink="/register">Create Account</a></p>

    </div>

    <!-- Forgot Password Modal -->
    <div class="forgot-box" *ngIf="forgotMode">
      <h3>Reset Password</h3>
      <div class="form-group" *ngIf="!otpMode">
        <label>Email Address</label>
        <input type="email" placeholder="Enter your email" [(ngModel)]="forgotEmail">
        <button class="login-btn" (click)="sendOtp()">Send OTP</button>
      </div>
      <div *ngIf="otpMode">
        <div class="form-group">
          <label>OTP</label>
          <input type="text" placeholder="Enter OTP" [(ngModel)]="otp">
        </div>
        <div class="form-group">
          <label>New Password</label>
          <input type="password" placeholder="New password" [(ngModel)]="newPassword">
        </div>
        <button class="login-btn" (click)="resetPassword()">Reset Password</button>
      </div>
      <p class="forgot-link" (click)="forgotMode=false;otpMode=false">Back to Login</p>
    </div>
  </div>

</div>
